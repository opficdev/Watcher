name: Merge Risk Watch

on:
  workflow_call:
    inputs:
      repository:
        description: "감시할 repository. owner/repo 형식"
        required: true
        type: string
      base_branch:
        description: "merge risk를 비교할 기준 branch"
        required: true
        type: string
      default_branch:
        description: "감시 대상에서 제외할 default branch"
        required: false
        type: string
        default: ""
      critical_file_patterns:
        description: "critical file wildcard pattern 목록. 줄바꿈으로 구분"
        required: false
        type: string
        default: ""
      watcher_version:
        description: "테스트할 Watcher release tag. 비워두면 workflow ref 기준"
        required: false
        type: string
        default: ""
      github_app_client_id:
        description: "watched repository 접근에 사용할 GitHub App client ID"
        required: true
        type: string
    secrets:
      watcher_github_app_private_key:
        description: "watched repository 접근에 사용할 GitHub App private key"
        required: true
      openai_api_key:
        description: "OpenAI prediction 호출에 사용할 API key"
        required: true
      discord_webhook_url:
        description: "선택 사항. report를 전송할 Discord webhook URL"
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: "감시할 repository. owner/repo 형식"
        required: true
        type: string
      base_branch:
        description: "merge risk를 비교할 기준 branch"
        required: true
        type: string
      default_branch:
        description: "감시 대상에서 제외할 default branch"
        required: false
        type: string
        default: ""
      critical_file_patterns:
        description: "critical file wildcard pattern 목록. 줄바꿈으로 구분"
        required: false
        type: string
        default: ""
      watcher_version:
        description: "테스트할 Watcher release tag. 비워두면 workflow ref 기준"
        required: false
        type: string
        default: ""
      github_app_client_id:
        description: "watched repository 접근에 사용할 GitHub App client ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  watch:
    name: Watch Merge Risk
    runs-on: macos-latest
    steps:
      - name: Resolve watched repository
        id: watched_repository
        env:
          WATCHER_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail

          if [[ "$WATCHER_REPOSITORY" != */* ]]; then
            echo "repository must use owner/repo format" >&2
            exit 1
          fi

          owner="${WATCHER_REPOSITORY%%/*}"
          repo="${WATCHER_REPOSITORY#*/}"

          if [[ -z "$owner" || -z "$repo" || "$repo" == */* ]]; then
            echo "repository must use owner/repo format" >&2
            exit 1
          fi

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Create watched repository GitHub App token
        id: github_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.github_app_client_id }}
          private-key: ${{ secrets.watcher_github_app_private_key || secrets.WATCHER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.watched_repository.outputs.owner }}
          repositories: ${{ steps.watched_repository.outputs.repo }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      - name: Checkout watched repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          token: ${{ steps.github_app_token.outputs.token }}
          path: watched-repository
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Fetch watched branches
        working-directory: watched-repository
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Resolve Watcher source
        id: watcher_source
        env:
          WATCHER_WORKFLOW_REF: ${{ job.workflow_ref }}
          WATCHER_VERSION: ${{ inputs.watcher_version }}
        run: |
          set -euo pipefail

          workflow_ref_name="${WATCHER_WORKFLOW_REF##*@}"
          release_tag=""

          if [[ -n "$WATCHER_VERSION" ]]; then
            release_tag="$WATCHER_VERSION"
          elif [[ "$workflow_ref_name" == refs/tags/* ]]; then
            release_tag="${workflow_ref_name#refs/tags/}"
          elif [[ "$workflow_ref_name" != refs/heads/* && "$workflow_ref_name" != refs/pull/* && ! "$workflow_ref_name" =~ ^[0-9a-f]{40}$ ]]; then
            release_tag="$workflow_ref_name"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Watcher
        if: steps.watcher_source.outputs.release_tag == ''
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: watcher

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download Watcher release
        if: steps.watcher_source.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHER_RELEASE_TAG: ${{ steps.watcher_source.outputs.release_tag }}
        run: |
          mkdir -p watcher-release watcher
          gh release download "${WATCHER_RELEASE_TAG}" \
            --repo "${{ job.workflow_repository }}" \
            --pattern watcher-deploy.tar.gz \
            --dir watcher-release
          tar -xzf watcher-release/watcher-deploy.tar.gz -C watcher

      - name: Install Watcher dependencies
        if: steps.watcher_source.outputs.release_tag == ''
        working-directory: watcher
        run: npm ci

      - name: Build Watcher
        if: steps.watcher_source.outputs.release_tag == ''
        working-directory: watcher
        run: npm run build

      - name: Run Watcher
        working-directory: watcher
        env:
          GITHUB_TOKEN: ${{ steps.github_app_token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key || secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url || secrets.DISCORD_WEBHOOK_URL }}
          WATCHER_REPOSITORY: ${{ inputs.repository }}
          WATCHER_GITHUB_API_URL: ${{ github.api_url }}
          WATCHER_REPOSITORY_PATH: ${{ github.workspace }}/watched-repository
          WATCHER_BASE_BRANCH: ${{ inputs.base_branch }}
          WATCHER_DEFAULT_BRANCH: ${{ inputs.default_branch }}
          WATCHER_CRITICAL_FILE_PATTERNS: ${{ inputs.critical_file_patterns }}
        run: npm run watch
