name: CI

on:
  pull_request:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare test build
        run: npm run build

      - name: Test
        run: npm test

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always() && (needs.build.result == 'failure' || needs.test.result == 'failure') && github.event.pull_request.head.repo.fork == false
    steps:
      - name: Comment CI failure on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          log_file="$(mktemp)"

          if ! gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed > "${log_file}"; then
            echo "failed logs를 조회하지 못함" > "${log_file}"
          fi

          {
            echo "## CI 실패"
            echo
            echo "- Build: \`${BUILD_RESULT}\`"
            echo "- Test: \`${TEST_RESULT}\`"
            echo "- 실행 로그: ${RUN_URL}"
            echo
            echo "\`\`\`text"
            tail -n 120 "${log_file}"
            echo "\`\`\`"
          } > comment.md

          gh pr comment "${PR_NUMBER}" --body-file comment.md
