name: CI

on:
  pull_request:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare test build
        run: npm run build

      - name: Test
        run: npm test

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always() && (needs.build.result == 'failure' || needs.test.result == 'failure') && github.event.pull_request.head.repo.fork == false
    steps:
      - name: Comment CI failure on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          log_file="$(mktemp)"
          summary_file="$(mktemp)"
          jobs_file="$(mktemp)"

          extract_failure_summary() {
            awk '
              /not ok |failureType:|error: \|-|AssertionError|The input did not match|Input:/ {
                start = NR - 4
                end = NR + 20
                if (start < 1) {
                  start = 1
                }
                for (line = start; line <= end; line += 1) {
                  selected[line] = 1
                }
              }
              /##\[error\]|Process completed with exit code/ {
                start = NR - 4
                end = NR
                if (start < 1) {
                  start = 1
                }
                for (line = start; line <= end; line += 1) {
                  selected[line] = 1
                }
              }
              {
                lines[NR] = $0
              }
              END {
                printed = 0
                for (line = 1; line <= NR; line += 1) {
                  if (selected[line]) {
                    print lines[line]
                    printed = 1
                  }
                }
                if (!printed) {
                  start = NR - 79
                  if (start < 1) {
                    start = 1
                  }
                  for (line = start; line <= NR; line += 1) {
                    print lines[line]
                  }
                }
              }
            ' "$1"
          }

          gh run view "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json jobs > "${jobs_file}"

          failed_job_id="$(jq -r '
            .jobs[]
            | select(.conclusion == "failure")
            | select(.name != "Report")
            | .databaseId
          ' "${jobs_file}" | head -n 1)"

          if [[ -n "${failed_job_id}" && "${failed_job_id}" != "null" ]]; then
            gh run view "${GITHUB_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --job "${failed_job_id}" \
              --log > "${log_file}" || echo "failed job log를 조회하지 못함" > "${log_file}"
          elif ! gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed > "${log_file}"; then
            echo "failed logs를 조회하지 못함" > "${log_file}"
          fi

          extract_failure_summary "${log_file}" > "${summary_file}"

          {
            echo "## CI 실패"
            echo
            echo "- Build: \`${BUILD_RESULT}\`"
            echo "- Test: \`${TEST_RESULT}\`"
            echo "- 실행 로그: ${RUN_URL}"
            echo
            echo "\`\`\`text"
            cat "${summary_file}"
            echo "\`\`\`"
          } > comment.md

          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file comment.md
