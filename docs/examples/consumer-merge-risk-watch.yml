name: Merge Risk Watch

on:
  schedule:
    - cron: "0 15 * * 0-4"
  workflow_dispatch:
    inputs:
      watcher_version:
        description: "테스트할 Watcher release tag. 비워두면 workflow ref 기준"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  watch:
    uses: opficdev/Watcher/.github/workflows/merge-risk-watch.yml@0.1.0
    with:
      repository: ${{ github.repository }}
      base_branch: develop
      default_branch: main
      watcher_version: ${{ inputs.watcher_version }}
      critical_file_patterns: |
        package-lock.json
        .github/workflows/**
    secrets:
      watcher_github_token: ${{ secrets.WATCHER_GITHUB_TOKEN }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
