name: Merge Risk Watch

on:
  schedule:
    - cron: "0 15 * * 0-4"
  workflow_dispatch:
    inputs:
      watcher_version:
        description: "테스트할 Watcher release tag. 비워두면 workflow ref 기준"
        required: false
        type: string
        default: ""
      upload_debug_artifact:
        description: "AI prediction 원인 추적용 debug artifact를 업로드할지 여부"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    uses: opficdev/Watcher/.github/workflows/merge-risk-watch.yml@0.1.0
    with:
      repository: ${{ github.repository }}
      base_branch: develop
      default_branch: main
      watcher_version: ${{ inputs.watcher_version }}
      upload_debug_artifact: ${{ inputs.upload_debug_artifact || false }}
    secrets:
      watcher_github_token: ${{ secrets.WATCHER_GITHUB_TOKEN }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
